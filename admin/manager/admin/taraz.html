<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
        <meta charset="UTF-8">
        <title>مرور ترازها و دفاتر مالی</title>
        <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
        <link rel="stylesheet"
                href="https://cdn.jsdelivr.net/npm/tabulator-tables@5.5.0/dist/css/tabulator_simple.min.css">
        <script src="https://cdn.jsdelivr.net/npm/tabulator-tables@5.5.0/dist/js/tabulator.min.js"></script>
        <script src="./sql/DataDecompressor.js"></script>
        <link rel="stylesheet" href="./Taraz.css">
        <script src="./sql/BinaDBManager.js?v=2"></script>
        <!-- <script src="./sql/BinaDBManager.js"></script> -->
        <script src="./sql/BinaReportEngine.js"></script>
      
        <script src="../../../FINAL/app/bina/bina-grid.js"></script>
  
   
</head>
<body>
  
  <div class="access-container">
    <div class="title-area">مرور ترازها و دفاتر مالی</div>
    
    <div class="top-controls">
      <!-- نام شرکت و سال مالی -->
      <div class="company-controls">
        <label>نام شرکت: 
          <select id="companyCode">
            <option value="">در حال بارگذاری...</option>
          </select>
        </label>
        <label>سال مالی: 
          <select id="fiscalYear">
            <option value="">--</option>
          </select>
        </label>
      </div>

      <!-- رادیو باتوم‌ها -->
      <div>
        <div class="radio-group">
          <label><input type="radio" name="level" value="kol" checked onchange="runTaraz()"> تراز کل</label>
          <label><input type="radio" name="level" value="moien" onchange="runTaraz()"> تراز معین</label>
          <label><input type="radio" name="level" value="tafsil" onchange="runTaraz()"> تراز تفصیل</label>
        </div>
        <div class="radio-group">
          <label><input type="radio" name="docType" value="all" checked> همه اسناد</label>
          <label><input type="radio" name="docType" value="bastan"> بدون بستن حساب‌ها</label><br>
          <label><input type="radio" name="docType" value="ekhtetamieh"> بدون بستن اسناد اختتامیه</label>
          <label><input type="radio" name="docType" value="eftetahieh"> بدون بستن تفصیلی</label>
        </div>
      </div>
    </div>

    <!-- دکمه زرد -->
    <div style="text-align: left;">
      <button class="btn-yellow" onclick="alert('بعدا پیاده‌سازی می‌شود')">تراز مقایسه ایی سالانه</button>
    </div>

    <!-- گرید -->
    <div id="gridContainer"></div>
  </div>
  
  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="modalTitle">جزئیات</h3>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body" id="modalGrid"></div>
    </div>
  </div>
       <script src="./sql/BinaTaraz.js"></script>
  <!-- لود فایل جاوااسکریپت اختصاصی این صفحه (در آخر) -->
 
</body>
</html>
