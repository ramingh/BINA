<!DOCTYPE html><html lang="fa"><meta charset="utf-8"><title>BINA v4.2 Integration Test</title><pre id="result">RUNNING</pre>
<script src="../manager/bina-db-manager.js?v=4.2.0"></script>
<script src="../sql/bina-query.js?v=4.2.0"></script>
<script>
(async()=>{
  const assert=(cond,message)=>{if(!cond)throw Error(message)};
  const output=document.getElementById('result');
  const events=[];
  const data={
    'tk_dic_FieldName':[[1,'kol_code','کد کل'],[2,'tafsil_code','کد تفصیل']],
    'tk_ssmsherkatholding':[[1,1300,'شرکت یک']],
    'tk_Test_Extra':[[1,'extra']],
    'Coding_1300':[[1,110,220,330,'عنوان تفصیل'],[2,110,220,331,'عنوان بعدی']],
    'Sanad_1395_1300':[[1,110,220,330,100,0],[2,110,220,331,200,0]]
  };
  const schemas={
    tk_dic_fieldname:['ID','FieldName','Caption'],
    tk_esmsherkatholding:['ID','Codesherkat','EsmSherkat'],
    tk_test_extra:['ID','Something'],
    coding_1300:['ID','Kol_Code','Moien_Code','Tafsil_Code','Tafsil_Onvan'],
    sanad_1395_1300:['ID','Kol_Code','Moien_Code','Tafsil_Code','Bedehkar','Bestankar']
  };
  window.fetch=async url=>{
    const u=new URL(url),mode=u.searchParams.get('mode'), name=u.searchParams.get('table');
    events.push(mode+':'+(name||''));
    if(mode==='tables')return {ok:true,json:async()=>Object.keys(data).map(table=>({table,count:data[table].length}))};
    if(mode==='stats')return {ok:true,json:async()=>({count:data[name].length,columns:schemas[name.toLowerCase()].map(n=>({name:n,type:'int'})),idIndex:0})};
    if(mode==='data')return {ok:true,json:async()=>data[name].filter(r=>r[0]>Number(u.searchParams.get('lastId')))};
    throw Error('Unexpected mode: '+mode);
  };
  // یک بانک قدیمی با نام‌های دارای حروف بزرگ و شماره نسخه بالا می‌سازیم.
  const created=await new Promise((yes,no)=>{
    const r=indexedDB.open('public',9);
    r.onupgradeneeded=()=>{
      const db=r.result;
      for(const store of ['Catalog','servertables','columns','tk_dic','tk_sherkat'])db.createObjectStore(store,{keyPath:'key'});
    };
    r.onsuccess=()=>yes(r.result);r.onerror=()=>no(r.error);
  });
  const initialVersion=created.version;created.close();
  const manager=new BinaDBManager({webservice:new BinaWebService({endpoint:'http://localhost/grid/FastDataHandler.ashx'}),blockSize:500,batchSize:500});
  const boot=await manager.bootstrap();
  assert(boot.tkTables.length===3,'سه TK دریافت نشد');
  const firstData=events.find(e=>e.startsWith('data:'));
  assert(firstData.toLowerCase().startsWith('data:tk_'),'اولین درخواست data باید TK باشد: '+firstData);
  const extra=await manager.getCatalog();
  assert(extra.some(x=>x.table==='tk_test_extra'&&x.received===1),'Catalog مربوط به TK اضافه خالی است');
  const shared=await manager._publicDB();
  assert(shared.name==='public'&&shared.version>=initialVersion,'نام یا نسخه بانک قدیمی حفظ نشد');
  assert(shared.objectStoreNames.contains('tk_dic'),'استور قدیمی حذف شد');
  assert(shared.objectStoreNames.contains('tk_test_extra'),'استور جدید TK ساخته نشد');
  const columnList=await new Promise((yes,no)=>{
    const r=shared.transaction('columns','readonly').objectStore('columns').getAll();r.onsuccess=()=>yes(r.result);r.onerror=()=>no(r.error);
  });
  assert(columnList.length===2,'بیش از دو Schema ساخته شد: '+columnList.length);
  assert(columnList.every(x=>x.columns.every(c=>c.name===c.name.toLowerCase())),'فیلدهای Schema lowercase نشد');
  const sync=await manager.syncTables(['Sanad_1395_1300','CODING_1300']);
  assert(sync.completed===2,'syncTables ناقص: '+JSON.stringify(sync));
  const row=await manager.getRows({companyCode:'1300',family:'sanad',year:1395,limit:5});
  assert(row.length===2&&row[0].bedehkar===100,'خواندن بلوک gzip یا Schema درست نیست '+JSON.stringify(row));
  const tk=await manager.getTKdic();
  assert(tk.length===2&&tk[0].fieldname,'فیلدهای TK lowercase نیست');
  const sql=new BinaSQL({maxRowsPerTable:5000,maxTotalRows:10000});
  await sql.ensureTablesForSQL({sql:'SELECT S.ID,C.Tafsil_Onvan FROM sanad_1395_1300 S INNER JOIN coding_1300 C ON S.Kol_Code=C.Kol_Code AND S.Moien_Code=C.Moien_Code AND S.Tafsil_Code=C.Tafsil_Code',maxRows:100});
  const results=sql.query({sql:'SELECT S.ID, C.Tafsil_Onvan FROM sanad_1395_1300 S INNER JOIN coding_1300 C ON S.Kol_Code=C.Kol_Code AND S.Moien_Code=C.Moien_Code AND S.Tafsil_Code=C.Tafsil_Code ORDER BY S.ID'});
  assert(results.rows.length===2,'INNER JOIN سه‌کلیدی نادرست '+JSON.stringify(results));
  const durable=await manager.requestPersistence();
  assert(typeof durable.persisted==='boolean','requestPersistence نتیجه معتبر ندارد');
  const publicNameList=(await indexedDB.databases()).map(x=>x.name);
  assert(!publicNameList.includes('public'),'پایگاه جدید تکراری در کنار public قدیمی ساخته شد');
  output.textContent='PASS: TK FIRST; 3 TK STORES; DYNAMIC VERSION; OLD PUBLIC PRESERVED; 2 SHARED SCHEMAS; GZIP; JOIN; PERSISTENCE API '+JSON.stringify({boot,sync,version:shared.version,persisted:durable.persisted});
  document.documentElement.setAttribute('data-result','PASS');
  await manager.close();
})().catch(err=>{
  document.getElementById('result').textContent='FAIL '+(err.stack||err);
  document.documentElement.setAttribute('data-result','FAIL');
});
</script></html>
