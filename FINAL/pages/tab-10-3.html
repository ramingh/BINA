<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>اسناد حسابداری شرکت‌ها</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/tabulator-tables@5.5.0/dist/css/tabulator_simple.min.css"
    />
    <link rel="stylesheet" href="../css/com_tab.css" />
    <link rel="stylesheet" href="../css/Bina-10-3.css" />
  </head>
  <body class="bina-form-page">
    <main class="bina-documents-page" aria-label="اسناد حسابداری شرکت‌ها">
      <div class="bina-documents-controls">
        <label for="bina-documents-company">نام شرکت:</label>
        <select
          id="bina-documents-company"
          translate="no"
          aria-label="نام شرکت"
        >
          <option value="">در حال دریافت فهرست شرکت‌ها…</option>
        </select>
        <label for="bina-documents-year">سال مالی:</label>
        <select id="bina-documents-year" aria-label="سال مالی" disabled>
          <option value="">—</option>
        </select>
        <span
          id="bina-documents-status"
          class="bina-documents-status"
          role="status"
          aria-live="polite"
        ></span>
      </div>
      <section
        id="bina-documents-grid"
        class="company-grid-host bina-documents-grid"
        aria-label="ردیف‌های اسناد حسابداری شرکت و سال مالی انتخاب‌شده"
      ></section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/tabulator-tables@5.5.0/dist/js/tabulator.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
    <script src="../app/com/com_tab.js"></script>
    <script src="../app/com/com_indexdb_read.js"></script>
    <script src="../app/com/com_indexdb_decompress.js"></script>
    <script src="../app/com/com_grid.js"></script>
    <script src="../app/bina/Bina-10-3.js"></script>
  </body>
</html>
