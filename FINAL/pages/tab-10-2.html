<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>کدینگ شرکت‌ها</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/tabulator-tables@5.5.0/dist/css/tabulator_simple.min.css"
    />
    <link rel="stylesheet" href="../css/com_tab.css" />
    <link rel="stylesheet" href="../css/Bina-10-2.css" />
  </head>
  <body class="bina-form-page">
    <main class="bina-coding-page" aria-label="کدینگ شرکت‌ها">
      <div class="bina-coding-controls">
        <label for="bina-coding-company">نام شرکت:</label>
        <select id="bina-coding-company" aria-label="نام شرکت" translate="no">
          <option value="">در حال دریافت فهرست شرکت‌ها…</option>
        </select>
        <span
          id="bina-coding-company-status"
          class="bina-coding-status"
          role="status"
          aria-live="polite"
        ></span>
      </div>
      <section
        id="bina-coding-grid"
        class="company-grid-host bina-coding-grid"
        aria-label="کدینگ شرکت انتخاب‌شده"
      ></section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/tabulator-tables@5.5.0/dist/js/tabulator.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
    <script src="../app/com/com_tab.js"></script>

    <script src="../app/com/com_indexdb_read.js"></script>

    <script src="../app/com/com_indexdb_decompress.js"></script>
    <script src="../app/com/com_grid.js"></script>
    <script src="../app/bina/Bina-10-2.js"></script>
  </body>
</html>
