<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>مرور حساب‌ها</title>

  <!-- کتابخانه‌های بیرونی -->
  <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tabulator-tables@5.5.0/dist/css/tabulator_simple.min.css">
  <script src="https://cdn.jsdelivr.net/npm/tabulator-tables@5.5.0/dist/js/tabulator.min.js"></script>

  <!-- گرید اختصاصی بینا -->
  <script src="../app/com/com_grid.js"></script>

  <!-- استایل اختصاصی تراز -->
  <link rel="stylesheet" href="./../css/Bina-15-8.css?v=1.2.55">

</head>
<body>
  <div class="access-container" id="app-container">
    <div class="top-controls">
      <!-- نام شرکت و سال مالی -->
      <div class="company-controls" role="group" aria-label="شرکت و سال مالی">
        <label class="taraz-field">
          <span class="taraz-label">نام شرکت:</span>
          <select id="companyCode">
            <option value="">در حال بارگذاری...</option>
          </select>
        </label>
        <label class="taraz-field">
          <span class="taraz-label">سال مالی:</span>
          <select id="fiscalYear">
            <option value="">--</option>
          </select>
        </label>
      </div>

      <!-- سطح تراز و نوع اسناد -->
      <div class="taraz-filters">
        <div class="radio-group">
          <label><input type="radio" name="level" value="kol" checked> تراز کل</label>
          <label><input type="radio" name="level" value="moien"> تراز معین</label>
          <label><input type="radio" name="level" value="tafsil"> تراز تفصیل</label>
        </div>
        <div class="radio-group doc-type-group" role="group" aria-label="نوع اسناد">
          <label><input type="radio" name="docType" value="all" checked> همه اسناد</label>
          <label><input type="radio" name="docType" value="bastan"> بدون سند بستن حساب‌ها</label>
          <label><input type="radio" name="docType" value="eftetahieh"> بدون سند افتتاحیه</label>
          <label><input type="radio" name="docType" value="ekhtetamieh"> بدون سند اختتامیه</label>
        </div>
      </div>
    </div>

    <div style="text-align: left;">
      <button class="btn-yellow" onclick="alert('بعدا پیاده‌سازی می‌شود')">تراز مقایسه ایی سالانه</button>
    </div>

    <!-- گرید اصلی -->
    <div id="gridContainer"></div>
  </div>
  <script src="../app/bina/Bina-15-8.js?v=1.2.55"></script>
  <!-- لود فایل اصلی جاوااسکریپت تراز -->
 
</body>
</html>
