<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Bina-Sanad-View - BINA</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/tabulator-tables@5.6.1/dist/css/tabulator.min.css"
    />
    <link rel="stylesheet" href="../css/com_sidebar_color.css" />
    <link rel="stylesheet" href="../css/Bina-15-1.css" />
    <link
      rel="stylesheet"
      id="bina-sanad-print-css"
      href="../css/BinaSanadPrint.css"
    />
    <link rel="stylesheet" href="../css/com_tab.css" />
  </head>
  <body>
    <main class="sanad-browser" aria-label="مرور اسناد حسابداری">
      <header class="sb-top">
        <div class="sb-field sb-company">
          <label for="sb-company">نام شرکت:</label>
          <select id="sb-company" translate="no" aria-label="نام شرکت">
            <option value="">در حال بارگذاری شرکت‌ها…</option>
          </select>
        </div>
        <div class="sb-field sb-year">
          <label for="sb-year">سال مالی:</label>
          <select id="sb-year" aria-label="سال مالی" disabled>
            <option value="">—</option>
          </select>
        </div>
        <span
          id="sb-status"
          class="sb-status"
          role="status"
          aria-live="polite"
        ></span>
      </header>

      <section class="sb-toolbar" aria-label="انتخاب سند و پیمایش">
        <div class="sb-document-info">
          <span class="sb-caption">شماره سند</span
          ><output id="sb-number" translate="no" class="sb-number">—</output>
          <span class="sb-caption">تاریخ سند</span
          ><output id="sb-date" translate="no" class="sb-date">—</output>
        </div>
        <div class="sb-doc-picker">
          <label for="sb-document">انتخاب سند:</label>
          <select
            id="sb-document"
            translate="no"
            disabled
            aria-label="شماره و تاریخ اسناد"
          >
            <option value="">سندی انتخاب نشده است</option>
          </select>
          <output id="sb-counter" class="sb-counter">۰ از ۰</output>
        </div>
        <div class="sb-navigation" role="group" aria-label="پیمایش اسناد">
          <button
            type="button"
            id="sb-first"
            title="اولین سند"
            aria-label="اولین سند"
            disabled
          >
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M4 5h2.4v14H4zM19 5 8.5 12 19 19z" />
            </svg>
          </button>
          <button
            type="button"
            id="sb-prev"
            title="سند قبلی"
            aria-label="سند قبلی"
            disabled
          >
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M18.5 4.5 7.5 12l11 7.5z" />
            </svg>
          </button>
          <button
            type="button"
            id="sb-next"
            title="سند بعدی"
            aria-label="سند بعدی"
            disabled
          >
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M5.5 4.5 16.5 12l-11 7.5z" />
            </svg>
          </button>
          <button
            type="button"
            id="sb-last"
            title="آخرین سند"
            aria-label="آخرین سند"
            disabled
          >
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M5 5 15.5 12 5 19zM17.6 5H20v14h-2.4z" />
            </svg>
          </button>
          <button
            type="button"
            id="sb-print"
            class="sb-print-test"
            title="چاپ سند فعلی"
            aria-label="چاپ سند"
            disabled
          >
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                d="M6.5 8V3.8h11V8M6.5 17H4.2a1.7 1.7 0 0 1-1.7-1.7v-5.2A2.1 2.1 0 0 1 4.6 8h14.8a2.1 2.1 0 0 1 2.1 2.1v5.2a1.7 1.7 0 0 1-1.7 1.7h-2.3M6.5 13.5h11v6.7h-11zM17.5 11.1h.1"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linejoin="round"
                stroke-linecap="round"
                fill="none"
              />
            </svg>
          </button>
          <span class="sb-print-test-badge" aria-hidden="true"
            >نسخه چاپ جدید</span
          >
        </div>
      </section>

      <section class="sb-grid-panel" aria-label="اقلام سند">
        <div id="sb-grid" class="sb-grid"></div>
      </section>

      <footer class="sb-footer">
        <div class="sb-account">
          <label for="sb-account-title">عنوان حساب:</label>
          <output id="sb-account-title" translate="no" class="sb-account-title"
            >برای نمایش عنوان، یک ردیف سند را انتخاب کنید.</output
          >
        </div>
        <section class="sb-totals" aria-label="جمع سند">
          <div class="sb-total">
            <span>جمع بدهکار</span
            ><output id="sb-total-debit" translate="no">۰</output>
          </div>
          <div class="sb-total">
            <span>جمع بستانکار</span
            ><output id="sb-total-credit" translate="no">۰</output>
          </div>
          <div class="sb-balance" id="sb-balance" aria-live="polite">—</div>
        </section>
      </footer>
    </main>

    <script src="https://unpkg.com/tabulator-tables@5.6.1/dist/js/tabulator.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
    <script src="../app/com/com_indexdb_read.js"></script>
    <script src="../app/com/com_indexdb_decompress.js"></script>
    <script src="../app/com/com_grid.js"></script>
    <script src="../com_dic.js"></script>
    <script src="../app/bina/BinaSanadPrint.js"></script>
    <script src="../app/bina/Bina-15-1.js"></script>
    <script>
      window.addEventListener("DOMContentLoaded", () => {
        const browser = new BinaSanadView(
          document.querySelector(".sanad-browser"),
        );
        window.BinaSanadPage = browser;
        browser
          .init()
          .then(async () => {
            const params = new URLSearchParams(window.location.search);
            const company = params.get("companyCode");
            const year = params.get("fiscalYear");
            const number = params.get("documentNumber");
            if (!company || !year || !number || !browser._initialized) return;
            const normalize = (value) =>
              String(value ?? "")
                .trim()
                .replace(/[۰-۹]/g, (d) => String(d.charCodeAt(0) - 0x06f0))
                .replace(/[٠-٩]/g, (d) => String(d.charCodeAt(0) - 0x0660));
            if (
              ![...browser.ui.company.options].some(
                (o) => normalize(o.value) === normalize(company),
              )
            ) {
              browser._status("شرکت سند انتخاب‌شده یافت نشد.", true);
              return;
            }
            browser.ui.company.value = [...browser.ui.company.options].find(
              (o) => normalize(o.value) === normalize(company),
            ).value;
            await browser._loadYears(
              browser.ui.company.value,
              ++browser._yearRequest,
            );
            const yearOption = [...browser.ui.year.options].find(
              (o) => normalize(o.value) === normalize(year),
            );
            if (!yearOption) {
              browser._status("سال مالی سند انتخاب‌شده یافت نشد.", true);
              return;
            }
            browser.ui.year.value = yearOption.value;
            await browser.load();
            const index = browser.docs.findIndex(
              (d) => normalize(d.number) === normalize(number),
            );
            if (index < 0) {
              browser._status(
                "شماره سند در شرکت و سال مالی انتخاب‌شده یافت نشد.",
                true,
              );
              return;
            }
            await browser.showDocument(index);
          })
          .catch((error) => console.error("[BinaSanadView:drill]", error));
      });
    </script>
  </body>
</html>
