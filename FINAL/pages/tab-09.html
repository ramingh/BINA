<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>بینا | مدیریت هوشمند نگاشت حساب‌ها (Coding-Index)</title>
    <!-- وابستگی‌های Tabulator و BinaGrid -->
    <link rel="stylesheet" href="../css/tabulator.min.css" />
    <link rel="stylesheet" href="../css/com_grid.css" />
    <style>
      :root {
        --bg: #0b1220;
        --panel: #121a2b;
        --panel2: #182235;
        --ink: #e8eef8;
        --muted: #8b9bb4;
        --line: #243047;
        --brand: #3b82f6;
        --ok: #15803d;
        --warn: #d97706;
        --bad: #dc2626;
        --font: IRANYekanX, Tahoma, "Segoe UI", system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: var(--font);
        font-size: 13px;
        background: var(--bg);
        color: var(--ink);
      }
      .wrap {
        max-width: 1400px;
        margin: 0 auto;
        padding: 12px 16px;
      }

      /* نوار عنوان و کنترل اصلی */
      .topbar {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        border-radius: 12px;
        margin-bottom: 10px;
        background: linear-gradient(135deg, #1e3a5f, #0f766e 120%);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .topbar h1 {
        margin: 0;
        font-size: 1rem;
        font-weight: 600;
      }
      .controls {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }

      /* نوار عملیات گروهی و آمار */
      .action-bar {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 10px 14px;
        margin-bottom: 10px;
      }
      .assign-box {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .stats-pills {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .pill {
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 12px;
        background: var(--panel2);
        border: 1px solid var(--line);
        color: var(--muted);
      }
      .pill b {
        color: var(--ink);
        margin-right: 4px;
      }
      .pill.ok b {
        color: #4ade80;
      }
      .pill.warn b {
        color: #fbbf24;
      }
      .pill.bad b {
        color: #f87171;
      }

      select,
      button {
        font-family: inherit;
        font-size: 12.5px;
        border-radius: 8px;
        padding: 7px 12px;
      }
      select {
        background: var(--panel2);
        color: var(--ink);
        border: 1px solid var(--line);
        min-width: 190px;
      }
      button {
        cursor: pointer;
        border: 0;
        color: #fff;
        background: var(--brand);
        transition: filter 0.15s;
      }
      button:hover:not(:disabled) {
        filter: brightness(1.12);
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      button.ok {
        background: var(--ok);
      }
      button.warn {
        background: var(--warn);
      }
      button.bad {
        background: var(--bad);
      }

      /* کانتینر BinaGrid */
      #gridContainer {
        background: #fff;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <!-- هدر -->
      <div class="topbar">
        <h1>مدیریت هوشمند نگاشت حساب‌ها (Coding-Index)</h1>
        <div class="controls">
          <select id="companySelect">
            <option value="">انتخاب شرکت...</option>
          </select>
          <button id="loadAndSyncBtn" class="ok">همگام‌سازی با سرور</button>
          <button id="pushToServerBtn" disabled>ثبت دایم (0)</button>
        </div>
      </div>

      <!-- نوار تخصیص گروه و آمار -->
      <div class="action-bar">
        <div class="assign-box">
          <span style="color: var(--muted)">تخصیص به ردیف‌های انتخاب‌شده:</span>
          <select id="assignGroupSelect">
            <option value="">— انتخاب گروه صورت مالی —</option>
          </select>
          <button id="applyGroupBtn" class="warn" disabled>اعمال گروه</button>
          <button
            id="clearGroupBtn"
            class="bad"
            disabled
            title="حذف گروه ردیف‌های انتخاب‌شده"
          >
            حذف گروه
          </button>
        </div>

        <div class="stats-pills">
          <span class="pill">کل حساب‌ها: <b id="statTotal">0</b></span>
          <span class="pill ok">همگام: <b id="statSynced">0</b></span>
          <span class="pill warn"
            >در انتظار ارسال: <b id="statPending">0</b></span
          >
          <span class="pill bad">بدون گروه: <b id="statNoGroup">0</b></span>
        </div>
      </div>

      <!-- محل قرارگیری BinaGrid -->
      <div id="gridContainer"></div>
    </div>

    <script src="../app/com/tabulator.min.js"></script>
    <script src="../app/com/com_grid.js"></script>
    <script src="../../admin/SoratMali_sh.js?v=6"></script>
  </body>
</html>
