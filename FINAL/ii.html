<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تست تراز حساب‌ها - بینا</title>
    <link href="https://unpkg.com/tabulator-tables@5.5.2/dist/css/tabulator.min.css" rel="stylesheet">
    <script src="https://unpkg.com/tabulator-tables@5.5.2/dist/js/tabulator.min.js"></script>
    <!-- استایل‌ها و کتابخانه‌های پایه -->
    <link rel="stylesheet" href="../FINAL/style.css">
    <script src="../FINAL/app/bina/alasql.min.js"></script>
    <script src="../FINAL/app/bina/bina-grid.js"></script>
    <script src="../FINAL/app/bina/bina-local-sql.js"></script>
    <script src="../FINAL/app/bina/bina-query-view.js"></script>
    <script src="../FINAL/app/bina/bina-page.js"></script>
    
    <!-- بارگذاری دیسکریپتور تراز حساب‌ها -->
    <script src="../trial-balance-desc.js"></script>

    <style>
        body {
            font-family: Tahoma, sans-serif;
            margin: 0;
            padding: 15px;
            background: #f1f5f9;
            box-sizing: border-box;
            height: 100vh;
        }
        /* کانتینر اصلی ویو که ارتفاع صفحه را کامل پر می‌کند بدون اسکرول بیرونی */
        #view {
            height: calc(100vh - 30px);
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            padding: 10px;
        }
    </style>
</head>
<body>

    <!-- المان هدف برای مانت شدن ویو -->
    <div id="view"></div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                // راه‌اندازی و اتصال صفحه با شناسه دیسکریپتور
                await BinaPage.mount('trial-balance', {
                    target: '#view'
                });
                console.log('✅ نمای تراز حساب‌ها با موفقیت بارگذاری شد.');
            } catch (err) {
                console.error('❌ خطا در بارگذاری نما:', err);
            }
        });
    </script>
</body>
</html>
